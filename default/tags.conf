#   TA-withings tags.conf — vendor-neutral dataset tags for the Wearables model.
#   Body composition is daily-class (weight/bmi/body_fat_pct on the Daily root),
#   so it carries wearable_daily — same as Garmin's bodycomp.

[eventtype=withings_body]
wearable = enabled
wearable_daily = enabled

#   Daily activity summary -> Activity/Daily datasets.
[eventtype=withings_activity]
wearable = enabled
wearable_daily = enabled
wearable_activity = enabled

#   Workout sessions -> Workout dataset (activity taxonomy lookup lives in wearables).
[eventtype=withings_workout]
wearable = enabled
wearable_workout = enabled

#   Nightly sleep summary (Sleep Analyzer / ScanWatch) -> Sleep dataset.
[eventtype=withings_sleep]
wearable = enabled
wearable_sleep = enabled
