#   TA-withings props.conf — canonical field normalization for Withings.
#
#   Boundary: IDENTITY (vendor, person_id) is stamped at INGEST as HEC indexed
#   fields — NOT here. This file does search-time normalization: JSON extraction
#   + field-name mapping to the canonical Wearables model. Raw JSON is kept in
#   _raw; every field below is additive.
#
#   The fetcher (withings_to_hec.py) DECODES Withings' value/type/unit measure
#   arrays into named, real-valued fields (weight, fat_ratio, ...) and computes
#   bmi — so this TA is simple EVAL renames. Sourcetype = withings:body.

# ---------------------------------------------------------------------------
# Body composition (scale)  ->  Wearables > Daily  (tag=wearable_daily)
#   Withings measure types decoded by the fetcher: 1=weight(kg), 6=fat_ratio(%),
#   8=fat_mass, 5=fat_free_mass, 76=muscle_mass, 88=bone_mass, 77=hydration,
#   4=height(m). bmi = weight / height^2 (fetcher-computed when height known).
# ---------------------------------------------------------------------------
[withings:body]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

# canonical (already on the Daily model root, shared with Garmin bodycomp)
EVAL-weight_kg    = weight
EVAL-bmi          = bmi
EVAL-body_fat_pct = fat_ratio
EVAL-lean_mass_kg = fat_free_mass
EVAL-fat_mass_kg  = fat_mass
# extended body composition — the fetcher requests these measure types, but only
# capable scales (Body Cardio / Body Scan / Body+) actually send them; on a
# weight+fat-only scale they're simply absent and the panels hideWhenNoData (#38).
EVAL-muscle_mass_kg = muscle_mass
EVAL-bone_mass_kg   = bone_mass
# Withings `hydration` is total body water as a PERCENT (e.g. 43.29 = 43.29%), NOT kg.
# Keep the native % AND compute real kg (weight x pct/100) so the kg tiles + the combined
# muscle/bone/water trend stay unit-consistent. Both null on a weight+fat-only scale.
EVAL-body_water_pct = hydration
EVAL-body_water_kg  = if(isnum(weight) AND isnum(hydration), round(weight * hydration / 100, 2), null())
EVAL-pwv            = pulse_wave_velocity

# vitals + advanced metrics from capable devices (ScanWatch = SpO2; BPM = blood
# pressure; Body Cardio/Scan = VO2max/PWV). The fetcher already decodes these and
# KV_MODE=json extracts vo2max / visceral_fat / systolic_bp / diastolic_bp under
# their canonical names directly; only SpO2 needs a rename so it feeds the
# cross-vendor Vitals tab (canonical spo2_avg). All absent on a weight+fat-only scale.
EVAL-spo2_avg       = spo2

# device identity (friendly name auto-derives; registry OUTPUTNEW only overrides)
EVAL-device_id    = "withings:" . deviceid
EVAL-device_name  = coalesce(model, "Withings device")

# vendor fallback for search-time (RBAC still uses the INDEXED vendor/person_id)
EVAL-vendor       = "withings"
EVAL-wearable_dataset = "body"

# enrichment: indexed person_id -> readable name + goals
LOOKUP-wearable_person = wearable_person_profile person_id OUTPUT person_name step_goal
LOOKUP-wearable_device = wearable_device_profile device_id OUTPUTNEW device_name

# ---------------------------------------------------------------------------
# Daily activity summary (getactivity)  ->  Activity/Daily (tag=wearable_activity)
#   Withings intensity fields (soft/moderate/intense) are DURATIONS in seconds;
#   distance is metres, calories = active calories.
# ---------------------------------------------------------------------------
[withings:activity]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
EVAL-steps            = steps
EVAL-distance_m       = distance
EVAL-active_calories  = calories
EVAL-total_calories   = totalcalories
EVAL-active_high_min  = round(intense/60,0)
EVAL-active_medium_min= round(moderate/60,0)
EVAL-active_low_min   = round(soft/60,0)
EVAL-vendor           = "withings"
EVAL-wearable_dataset = "activity"
LOOKUP-wearable_person = wearable_person_profile person_id OUTPUT person_name step_goal

# ---------------------------------------------------------------------------
# Workout sessions (getworkouts)  ->  Workout (tag=wearable_workout)
#   activity = decoded category label (fetcher WORKOUT_CATEGORY); the wearables
#   app maps it to workout_activity_canon/group via LOOKUP-wearable_activity.
# ---------------------------------------------------------------------------
[withings:workouts]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
EVAL-workout_activity     = activity
EVAL-workout_start_epoch  = startdate
EVAL-workout_end_epoch    = enddate
EVAL-workout_calories     = calories
EVAL-workout_distance_m   = distance
EVAL-workout_id           = "withings:" . workout_id
EVAL-vendor               = "withings"
EVAL-wearable_dataset     = "workout"
LOOKUP-wearable_person = wearable_person_profile person_id OUTPUT person_name

# ---------------------------------------------------------------------------
# Nightly sleep summary (Sleep API getsummary)  ->  Sleep (tag=wearable_sleep)
#   Durations are SECONDS. efficiency computed from asleep/in-bed to avoid the
#   0-1 vs 0-100 ambiguity in the raw sleep_efficiency field.
# ---------------------------------------------------------------------------
[withings:sleep]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
EVAL-sleep_type       = "long_sleep"
EVAL-total_sleep_min  = round(coalesce(total_sleep_time, deepsleepduration+lightsleepduration+remsleepduration)/60,1)
EVAL-time_in_bed_min  = round(total_timeinbed/60,1)
EVAL-deep_min         = round(deepsleepduration/60,1)
EVAL-light_min        = round(lightsleepduration/60,1)
EVAL-rem_min          = round(remsleepduration/60,1)
EVAL-awake_min        = round(wakeupduration/60,1)
EVAL-latency_min      = round(durationtosleep/60,1)
EVAL-avg_hr           = hr_average
EVAL-lowest_hr        = hr_min
EVAL-respiration_avg  = rr_average
EVAL-efficiency_pct   = round(100*coalesce(total_sleep_time, deepsleepduration+lightsleepduration+remsleepduration)/total_timeinbed,1)
EVAL-sleep_score      = sleep_score
EVAL-bedtime_start    = strftime(startdate,"%Y-%m-%dT%H:%M:%S")
EVAL-bedtime_end      = strftime(enddate,"%Y-%m-%dT%H:%M:%S")
EVAL-vendor           = "withings"
EVAL-wearable_dataset = "sleep"
LOOKUP-wearable_person = wearable_person_profile person_id OUTPUT person_name
