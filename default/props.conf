#   TA-withings props.conf — canonical field normalization for Withings.
#
#   Boundary: IDENTITY (vendor, person_id) is stamped at INGEST as HEC indexed
#   fields — NOT here. This file does search-time normalization: JSON extraction
#   + field-name mapping to the canonical Wearables model. Raw JSON is kept in
#   _raw; every field below is additive.
#
#   The fetcher (withings_to_hec.py) DECODES Withings' value/type/unit measure
#   arrays into named, real-valued fields (weight, fat_ratio, ...) and computes
#   bmi — so this TA is simple EVAL renames. Sourcetype = withings:body.

# ---------------------------------------------------------------------------
# Body composition (scale)  ->  Wearables > Daily  (tag=wearable_daily)
#   Withings measure types decoded by the fetcher: 1=weight(kg), 6=fat_ratio(%),
#   8=fat_mass, 5=fat_free_mass, 76=muscle_mass, 88=bone_mass, 77=hydration,
#   4=height(m). bmi = weight / height^2 (fetcher-computed when height known).
# ---------------------------------------------------------------------------
[withings:body]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

# canonical (already on the Daily model root, shared with Garmin bodycomp)
EVAL-weight_kg    = weight
EVAL-bmi          = bmi
EVAL-body_fat_pct = fat_ratio
EVAL-lean_mass_kg = fat_free_mass
EVAL-fat_mass_kg  = fat_mass
# extended body composition — the fetcher requests these measure types, but only
# capable scales (Body Cardio / Body Scan / Body+) actually send them; on a
# weight+fat-only scale they're simply absent and the panels hideWhenNoData (#38).
EVAL-muscle_mass_kg = muscle_mass
EVAL-bone_mass_kg   = bone_mass
EVAL-body_water_kg  = hydration
EVAL-pwv            = pulse_wave_velocity

# vitals + advanced metrics from capable devices (ScanWatch = SpO2; BPM = blood
# pressure; Body Cardio/Scan = VO2max/PWV). The fetcher already decodes these and
# KV_MODE=json extracts vo2max / visceral_fat / systolic_bp / diastolic_bp under
# their canonical names directly; only SpO2 needs a rename so it feeds the
# cross-vendor Vitals tab (canonical spo2_avg). All absent on a weight+fat-only scale.
EVAL-spo2_avg       = spo2

# device identity (friendly name auto-derives; registry OUTPUTNEW only overrides)
EVAL-device_id    = "withings:" . deviceid
EVAL-device_name  = coalesce(model, "Withings device")

# vendor fallback for search-time (RBAC still uses the INDEXED vendor/person_id)
EVAL-vendor       = "withings"
EVAL-wearable_dataset = "body"

# enrichment: indexed person_id -> readable name + goals
LOOKUP-wearable_person = wearable_person_profile person_id OUTPUT person_name step_goal
LOOKUP-wearable_device = wearable_device_profile device_id OUTPUTNEW device_name
