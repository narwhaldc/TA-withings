#   TA-withings — Withings technology add-on for the Wearables platform
#   Ingest-side field normalization: maps flattened Withings measurement
#   events into the canonical "Wearables" data model (Daily: body composition).
#   Data is delivered to HEC by withings_to_hec.py (index=wearables), with
#   indexed fields vendor + person_id set at ingest.

