#   TA-withings eventtypes.conf — tag Withings events into the Wearables model.
#   The data model (in the wearables app) constrains its datasets on these
#   vendor-neutral tags, so any vendor's TA can contribute the same way.

[withings_body]
search = sourcetype=withings:body

[withings_activity]
search = sourcetype=withings:activity

[withings_workout]
search = sourcetype=withings:workouts

[withings_sleep]
search = sourcetype=withings:sleep
